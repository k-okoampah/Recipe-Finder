<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Finder | Discover Delicious Recipes</title>
    <meta name="description" content="Discover delicious recipes, explore new flavours and find meal ideas for your next dish." />
    <meta name="theme-color" content="#0056B3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Recipe Finder | Discover Delicious Recipes" />
    <meta property="og:description" content="Discover delicious recipes, explore new flavours and find meal ideas for your next dish." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Recipe Finder | Discover Delicious Recipes" />

    <!-- Preconnect & DNS prefetch for critical origins -->
    <link rel="preconnect" href="https://www.themealdb.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.themealdb.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />

    <!-- Non-blocking font loading with fallback -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
    </script>
